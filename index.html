  /* phone friendly: lighter blurs, smaller decorative blobs */
  @media (max-width:820px){

.rv.in{ opacity:1; transform:none; }

*/

/* storage can be blocked (private mode / file://) — never let it throw */
function store(k,v){ try{ if(v===undefined) return

localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } }
let lang = store('vr-lang') || 'ar';
if(T[lang] === undefined) lang = 'ar';

window.addEventListener('error', function(){ var v = document.getElementById('veil'); if(v) v.classList.add('done'); });
window.addEventListener('orientationchange', function(){ setTimeout(moveInd, 350); });

/* ---------- LANGUAGE ---------- */
function applyLang(){
  const d = T[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
  document.title = lang === 'ar' ? 'فيلفيت روز — أتيليه الزهور في لبنان' : 'VELVET ROSE — Flower Atelier Lebanon';

  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.getAttribute('data-i18n');
    if (d[k] !== undefined) el.textContent = d[k];
  });
  document.querySelectorAll('[data-i18n-html]').forEach(el=>{
    const k = el.getAttribute('data-i18n-html');
    if (typeof d[k] === 'string') el.innerHTML = d[k];
  });

  // pill indicator
  moveInd();
  document.querySelectorAll('.langBtn').forEach(b=>{
    const on = b.getAttribute('data-lang') === lang;
    b.style.color = on ? '#F7E3E6' : '#3A1220';
    b.style.opacity = on ? '1' : '.55';
  });

  renderTicker(); renderCustom(); renderFilters(); renderGrid();
  renderSteps(); renderValues(); renderTests(); renderFaqs(); renderInfo(); renderTray(); updateBuilder();
  syncWaLinks();
  document.getElementById('veilSub').textContent = lang === 'ar' ? 'أتيليه الزهور · لبنان' : 'FLOWER ATELIER · LEBANON';
}
document.querySelectorAll('.langBtn').forEach(b=>{
  b.addEventListener('click', ()=>{
    const l = b.getAttribute('data-lang');
    if (l === lang) return;
    lang = l; store('vr-lang', l);
    applyLang(); toast(t().toastLang);
  });
});
function moveInd(){
  const btn = document.querySelector('.langBtn[data-lang="'+lang+'"]');
  const wrap = document.getElementById('langWrap'), ind = document.getElementById('langInd');
  if(!btn  !wrap  !ind) return;
  const wr = wrap.getBoundingClientRect(), br = btn.getBoundingClientRect();
  ind.style.width = br.width + 'px';
  ind.style.transform = 'translateX(' + (br.left - wr.left) + 'px)';
}
window.addEventListener('resize', moveInd);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(()=> requestAnimationFrame(moveInd));

    : 'Hello Velvet Rose 🌹\nI would like to ask about and order flowers.\n\nName: \nDelivery area: \nDate & time: \nBudget: ';

/* every WhatsApp button becomes a REAL link (href) so phones open the app natively */
function syncWaLinks(){
  document.querySelectorAll('[data-wa]').forEach(a=>{
    const k = a.getAttribute('data-wa');
    a.setAttribute('target','_blank');
    a.setAttribute('rel','noopener noreferrer');
    a.href = wa(k === 'custom' ? t().msgCustom : waGeneric());
  });
  ['trayWa','qvWa','builderWa'].forEach(id=>{
    const el = document.getElementById(id);
    if(el){ el.setAttribute('target','_blank'); el.setAttribute('rel','noopener noreferrer'); }
  });
}
/* fallback used by dynamically built links */
function openWa(url){
  try{
    const a = document.createElement('a');
    a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.style.cssText = 'position:fixed;opacity:0;pointer-events:none';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ a.remove(); }, 4000);
  }catch(err){ window.location.href = url; }
}

/* ---------- SELECTION TRAY ---------- */
function toggleFav(id){
  const i = sel.findIndex(s=>s.id===id);
  if(i>-1){ sel.splice(i,1); toast(t().toastRemoved); } else { sel.push({id, qty:1}); toast(t().toastAdded); }
  renderGrid(); renderTray();
}
function renderTray(){
  const box = document.getElementById('trayItems');
  document.getElementById('trayCount').textContent = sel.reduce((a,s)=>a+s.qty,0);
  if(!sel.length){
    box.innerHTML = '<p class="text-[14px] leading-relaxed text-[#241017]/45 py-10 text-center">'+(lang==='ar'?'سلة الورد فاضية — اضغط على القلب بأي قطعة لتحتفظ فيها.':'Your flower selection is empty — tap the heart on any piece to save it.')+'</p>';
  } else {
    box.innerHTML = sel.map(s=>{
      const p = PRODUCTS.find(x=>x.id===s.id), d = p[lang];
      return '<div class="flex gap-4 items-center">'+
        '<img src="'+p.img+'" alt="" class="w-16 h-16 rounded-[2px] object-cover shrink-0">'+
        '<div class="min-w-0 flex-1">'+
          '<div class="display text-[17px] leading-snug">'+d.n+'</div>'+
          '<div class="text-[11px] uppercase tracking-[.18em] text-[#A62F55] mt-1">$'+p.price+'</div>'+
          '<div class="mt-2 flex items-center gap-2">'+
            '<button data-tq="'+p.id+'" data-d="-1" class="w-7 h-7 rounded-full border border-[#3A1220]/15 grid place-items-center hover:bg-[#F7E3E6]">−</button>'+
            '<span class="num text-sm w-6 text-center">'+s.qty+'</span>'+
            '<button data-tq="'+p.id+'" data-d="1" class="w-7 h-7 rounded-full border border-[#3A1220]/15 grid place-items-center hover:bg-[#F7E3E6]">+</button>'+
            '<button data-tr="'+p.id+'" class="ms-auto text-[10px] uppercase tracking-[.2em] text-[#241017]/40 hover:text-[#C4476B] transition-colors">'+t().remove+'</button>'+
          '</div>'+
        '</div></div>';
    }).join('');
    box.querySelectorAll('[data-tq]').forEach(b=> b.onclick = ()=>{
      const s = sel.find(x=>x.id==b.getAttribute('data-tq'));
      s.qty = Math.max(1, s.qty + (+b.getAttribute('data-d'))); renderTray(); renderGrid();
    });

box.querySelectorAll('[data-tr]').forEach(b=> b.onclick = ()=>{
      sel = sel.filter(x=>x.id != b.getAttribute('data-tr')); renderTray(); renderGrid();
    });
  }
  const total = sel.reduce((a,s)=> a + PRODUCTS.find(p=>p.id===s.id).price * s.qty, 0);
  document.getElementById('trayTotal').textContent = '$' + total;
  let msg = t().msgTray;
  sel.forEach(s=>{ const p=PRODUCTS.find(x=>x.id===s.id); msg += '• ' + p[lang].n + ' — $' + p.price + ' × ' + s.qty + '\n'; });
  msg += t().msgTrailer + '$' + total + t().msgTrailer2;
  document.getElementById('trayWa').href = wa(msg);
}
document.getElementById('trayBtn').onclick = ()=> openSheet('tray');

/* ---------- SHEETS (tray / quickview) ---------- */
const scrim = document.getElementById('scrim');
function openSheet(id){
  document.querySelectorAll('.sheet').forEach(s=>{ if(s.id!==id) s.classList.add('hidden-sheet'); });
  document.getElementById(id).classList.remove('hidden-sheet');
  scrim.classList.add('on'); document.body.style.overflow='hidden';
}
function closeSheets(){
  document.querySelectorAll('.sheet').forEach(s=>s.classList.add('hidden-sheet'));
  scrim.classList.remove('on'); document.body.style.overflow='';
}
scrim.onclick = closeSheets;
document.querySelectorAll('[data-close-sheet]').forEach(b=> b.onclick = closeSheets);
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ closeSheets(); closeMenu(); } });

/* ---------- QUICK VIEW ---------- */
let qvId = null, qvQty = 1;
function openQv(id){
  qvId = id; qvQty = 1;
  const p = PRODUCTS.find(x=>x.id===id), d = p[lang];
  document.getElementById('qvImg').src = p.img;
  document.getElementById('qvImg').alt = d.n;
  document.getElementById('qvCat').textContent = t().cat[p.cat];
  document.getElementById('qvName').textContent = d.n;
  document.getElementById('qvDesc').textContent = d.d;
  document.getElementById('qvPrice').textContent = '$' + p.price;
  document.getElementById('qvQtyVal').textContent = qvQty;
  document.getElementById('qvWa').href = wa(orderMsg(p,1));
  openSheet('qv');
}
document.getElementById('qvPlus').onclick = ()=>{ qvQty++; syncQv(); };
document.getElementById('qvMinus').onclick = ()=>{ qvQty = Math.max(1, qvQty-1); syncQv(); };
function syncQv(){
  document.getElementById('qvQtyVal').textContent = qvQty;
  const p = PRODUCTS.find(x=>x.id===qvId);
  document.getElementById('qvWa').href = wa(orderMsg(p,qvQty));
}
document.getElementById('qvAdd').onclick = ()=>{
  const ex = sel.find(s=>s.id===qvId);
  if(ex) ex.qty += qvQty; else sel.push({id:qvId, qty:qvQty});
  renderTray(); renderGrid(); closeSheets(); toast(t().toastAdded);
};

let toastT;
